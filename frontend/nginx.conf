server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Use Kubernetes/Cluster internal DNS resolver to safely pass traffic to gateway-service
        resolver 10.0.0.10 valid=10s;
        set $target http://gateway-service:5000;
        proxy_pass $target$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}