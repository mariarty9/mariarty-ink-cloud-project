
#Gateway microservice
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  #NOTE: kept at 1 replica because the SQLite DB lives on a ReadWriteOnce volume — multiple pods can't safely share one SQLite file. Scaling this to >1 replica requires moving to a real database
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: mariartyacr2026.azurecr.io/gateway-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: BOOKING_SERVICE_URL
          value: "http://booking-service:5001"
        - name: SHOP_SERVICE_URL
          value: "http://shop-service:5003"
        - name: DATA_DIR
          value: "/app/data"
        volumeMounts:
        - name: gateway-data
          mountPath: /app/data
      volumes:
      - name: gateway-data
        persistentVolumeClaim:
          claimName: gateway-data-pvc

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: gateway

